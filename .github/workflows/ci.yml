name: CI

on:
  push:
    branches: [main, develop, apf2, apf3]
  pull_request:
  workflow_dispatch:

jobs:
  # 1) Pruebas de humo: si la funcionalidad principal no responde, no se gasta tiempo en el resto.
  humo:
    name: Pruebas de humo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas de humo (-Dgroups=humo)
        run: mvn -B test -Dgroups=humo

  # 2) Suite completa del back-end: unitarias, integración, seguridad, rendimiento y regresión (todo lo existente).
  backend:
    name: Back-end (suite completa + cobertura)
    needs: humo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Pruebas y construcción (mvn verify)
        run: mvn -B verify
      - name: Resumen de cobertura (JaCoCo)
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import csv, os
          ruta = "target/site/jacoco/jacoco.csv"
          if not os.path.exists(ruta):
              print("No se generó el informe de cobertura.")
          else:
              filas = list(csv.DictReader(open(ruta, encoding="utf-8")))
              def pct(cubierto, perdido):
                  total = cubierto + perdido
                  return 100.0 * cubierto / total if total else 0.0
              instr_c = sum(int(f["INSTRUCTION_COVERED"]) for f in filas)
              instr_m = sum(int(f["INSTRUCTION_MISSED"]) for f in filas)
              ram_c = sum(int(f["BRANCH_COVERED"]) for f in filas)
              ram_m = sum(int(f["BRANCH_MISSED"]) for f in filas)
              print("### Cobertura de pruebas del back-end")
              print("")
              print("| Métrica | Cobertura |")
              print("|---|---|")
              print(f"| Instrucciones | {pct(instr_c, instr_m):.1f} % |")
              print(f"| Ramas | {pct(ram_c, ram_m):.1f} % |")
          EOF
      - name: Subir informes (pruebas y cobertura)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-backend
          path: |
            backend/target/surefire-reports
            backend/target/site/jacoco
          if-no-files-found: ignore

  frontend:
    name: Front-end (pruebas unitarias + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Auditoría de dependencias (solo informa)
        run: npm audit --audit-level=high
        continue-on-error: true

  # 3) Pruebas de sistema/aceptación en navegador real (Playwright).
  # TODO: quitar "continue-on-error" cuando la suite haya pasado en verde al menos una vez en GitHub Actions.
  e2e:
    name: Pruebas E2E (navegador)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dependencias del front-end
        run: npm ci
        working-directory: frontend
      - name: Dependencias y navegador de las pruebas E2E
        run: |
          npm install
          npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Ejecutar pruebas E2E
        run: npx playwright test
        working-directory: e2e
        env:
          CI: 'true'
      - name: Subir informe de Playwright
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informe-e2e
          path: e2e/playwright-report
          if-no-files-found: ignore
