name: Release

# Al publicar una etiqueta vX.Y.Z (versionado semántico) se vuelve a probar el código etiquetado
# y se crea la release de GitHub con las notas de esa versión tomadas de CHANGELOG.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Publicar release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verificar que la versión del pom coincide con la etiqueta
        run: |
          VERSION_POM=$(mvn -q -f backend/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$VERSION_POM" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión del pom ($VERSION_POM)."
            exit 1
          fi
      - name: Pruebas del back-end
        run: mvn -B verify
        working-directory: backend
      - name: Pruebas y build del front-end
        run: npm ci && npm test && npm run build
        working-directory: frontend
      - name: Notas de la versión desde CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { dentro=1; next }
            dentro && /^## \[/ { exit }
            dentro { print }
          ' CHANGELOG.md > notas.md
          if [ ! -s notas.md ]; then
            echo "::error::CHANGELOG.md no tiene la sección [$VERSION]."
            exit 1
          fi
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Matemática Sin Estrés $GITHUB_REF_NAME" --notes-file notas.md --verify-tag
