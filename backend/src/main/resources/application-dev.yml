# Perfil de desarrollo: base H2 en memoria emulando PostgreSQL.
# Flyway crea el esquema y carga los datos iniciales en cada arranque.
spring:
  datasource:
    url: jdbc:h2:mem:mse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  jwt:
    # Secreto SOLO para desarrollo local. En producción se exige la variable JWT_SECRET.
    secret: ${JWT_SECRET:ZGV2LXNvbG8tcGFyYS1kZXNhcnJvbGxvLWxvY2FsLU5PLXVzYXItZW4tcHJvZHVjY2lvbi0yMDI2}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
