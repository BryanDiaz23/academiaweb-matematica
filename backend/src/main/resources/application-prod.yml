# Perfil de producción: PostgreSQL gestionado (Render). Sin valores por defecto para secretos.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      max-lifetime: 240000        # 4 min: se recicla antes de que la BD remota cierre conexiones inactivas
      idle-timeout: 120000
      connection-timeout: 20000
      keepalive-time: 60000

server:
  forward-headers-strategy: framework   # respeta X-Forwarded-For/Proto del balanceador

logging:
  level:
    org.hibernate.SQL: WARN
