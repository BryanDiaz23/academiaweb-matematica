# Entorno completo con PostgreSQL en contenedores (igual que producción).
# Uso:  JWT_SECRET=$(openssl rand -base64 32) docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mse
      POSTGRES_USER: mse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mse_local_2026}
    ports:
      - "5432:5432"
    volumes:
      - mse-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mse -d mse"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mse
      DB_USER: mse
      DB_PASSWORD: ${DB_PASSWORD:-mse_local_2026}
      JWT_SECRET: ${JWT_SECRET:?Define la variable JWT_SECRET (clave Base64 de 32 bytes o más)}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

volumes:
  mse-datos:
